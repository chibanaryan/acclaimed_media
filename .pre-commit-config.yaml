fail_fast: true
repos:
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
  - repo: local
    hooks:
      - id: pytest
        name: Run tests with coverage
        entry: bash -c "source venv/bin/activate && DATABASE_URL=sqlite:///db.sqlite3 CACHE_URL=locmemcache:// CORS_ALLOWED_ORIGINS=http://localhost pytest"
        language: system
        pass_filenames: false
      - id: django-tests
        name: Run tests under Django's runner (no conftest)
        entry: scripts/run_tests.sh
        language: system
        pass_filenames: false
        stages: [manual]
