{# HTMX search dropdown results. #}
{% if albums %}
<ul class="menu bg-base-200 rounded-box w-full shadow-lg">
    {% for album in albums %}
    <li>
        <a href="{{ album.get_absolute_url }}" class="flex items-baseline gap-2">
            <span class="text-accent tabular-nums text-xs">#{{ album.rank }}</span>
            <span class="font-semibold truncate">{{ album.name }}</span>
            <span class="text-xs text-base-content/70 truncate">{{ album.artist_credit }}</span>
            {% if album.year_released %}<span class="text-xs text-base-content/50">{{ album.year_released }}</span>{% endif %}
        </a>
    </li>
    {% endfor %}
</ul>
{% else %}
<div class="p-3 text-sm text-base-content/70">No albums found.</div>
{% endif %}
