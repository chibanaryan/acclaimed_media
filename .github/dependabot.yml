# Weekly update PRs, checked by .github/workflows/ci.yml. Security updates
# are separate: GitHub opens those as soon as an advisory lands, ungrouped.
# See "Keeping dependencies current" in AGENTS.md.
version: 2
updates:
  # Dependabot edits requirements*.in and re-runs pip-compile on both locks.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        # A Django feature release (6.2, 7.1) is semver-minor but can remove
        # deprecated APIs, so it gets a PR of its own.
        exclude-patterns: [django]

  # Build-time only, but a version that changes the compiled CSS fails CI's
  # css job until someone rebuilds and looks at the result.
  - package-ecosystem: npm
    directory: "/theme/static_src"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
