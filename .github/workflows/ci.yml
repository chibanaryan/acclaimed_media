# Every push to main and every PR (Dependabot's included). The Monday run
# only re-audits the locks against advisories published since the last push;
# every other job skips it.
# See "Keeping dependencies current" in AGENTS.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# timeout-minutes on every job: a test that deadlocks (a thread waiting on a
# row the test's transaction holds) otherwise runs to GitHub's six hours.

# A PR's runs share a group by ref, and a newer push cancels the older run.
# Every other run gets a group of its own, by event and commit: on main every
# push is a merge and gets its result. cancel-in-progress alone did not see to
# that, since GitHub keeps one *pending* run per group whatever it says, so
# with one group for the branch the middle of three quick pushes never ran,
# and a push on a Monday morning could cancel the waiting audit. The event is
# in the name so that the audit and a push of the same commit do not share.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CACHE_URL: locmemcache://
  CORS_ALLOWED_ORIGINS: http://localhost
  DATABASE_URL: sqlite:///db.sqlite3

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install $(grep '^pre-commit==' requirements-dev.txt)
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          # The Python version too: the hooks' environments are built on
          # it, and a bump reused the ones built for the last
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}
      # Only the lint hooks: the pytest hook expects a local venv/.
      - run: pre-commit run black --all-files --show-diff-on-failure
      - run: pre-commit run flake8 --all-files

  pytest:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The parity tests run the real JavaScript under Node, and fail here
      # rather than skip if it is missing (core/tests/node.py)
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Both locks at once: pip refuses two different pins for one package,
      # so a production lock recompiled without the dev lock fails here.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # pytest.ini carries the 100% coverage gate.
      - run: pytest

  # The same suites under Django's runner, without conftest.py (which hides
  # cache and process-state leaks between tests), on production's database:
  # SQLite enforces neither varchar lengths nor some constraints, so a test
  # can pass locally and the write still fail on Heroku. One job for both,
  # since 2026-10-26: the suite ran three times before, pytest on SQLite and
  # on Postgres plus this runner on SQLite. Coverage is the pytest job's gate.
  django-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acclaimed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The parity tests run the real JavaScript under Node, and fail here
      # rather than skip if it is missing (core/tests/node.py)
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Both locks at once: pip refuses two different pins for one package,
      # so a production lock recompiled without the dev lock fails here.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: scripts/run_tests.sh

  # requirements.txt alone, as Heroku installs it. Every other job installs
  # the dev lock too, so an import satisfied only by a dev package (or by one
  # of their dependencies) would pass them and fail on the dyno.
  production-install:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy --fail-level WARNING
      - name: Import every non-test module
        run: |
          python manage.py shell -c "
          import importlib, pkgutil, django.urls
          django.urls.get_resolver().url_patterns
          for app in ('core', 'games', 'books', 'music'):
              for m in pkgutil.walk_packages(importlib.import_module(app).__path__, app + '.'):
                  if '.tests' not in m.name and '.migrations' not in m.name:
                      importlib.import_module(m.name)
          "
      # Production's static storage. Tests use plain storage, so a template
      # naming a file the manifest lacks raises only here - while rendering,
      # taking the page down - and a literal unhashed /static/ path 404s,
      # since only the hashed copies are kept.
      - run: python manage.py collectstatic --noinput
      - run: python manage.py migrate --noinput
      - name: Render pages under manifest storage
        run: |
          python manage.py shell -c "
          from django.test import Client
          # testserver is allowed only under test settings, so each site is
          # asked for by its real host, which also picks its URLconf
          client = Client(raise_request_exception=True)
          pages = {
              'acclaimedmedia.org': ('/', '/sitemap.xml'),
              'games.acclaimedmedia.org': ('/', '/developers/', '/lists/', '/blog/', '/sitemap.xml'),
              'music.acclaimedmedia.org': ('/', '/artists/', '/lists/', '/sitemap.xml'),
          }
          for host, paths in pages.items():
              for path in paths:
                  status = client.get(path, HTTP_HOST=host, secure=True).status_code
                  print(host, path, status)
                  assert status == 200, host + path
          # Heroku's router ends TLS and says so in X-Forwarded-Proto, which
          # SECURE_PROXY_SSL_HEADER names: with it a request is served,
          # without it redirected. The production block of settings runs
          # only here, so this is its one check.
          host = 'games.acclaimedmedia.org'
          https = client.get('/healthz/', HTTP_HOST=host, HTTP_X_FORWARDED_PROTO='https')
          assert https.status_code == 200, https.status_code
          plain = client.get('/healthz/', HTTP_HOST=host)
          assert plain.status_code == 301, plain.status_code
          assert plain['Location'] == 'https://' + host + '/healthz/', plain['Location']
          "

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install $(grep '^pip-audit==' requirements-dev.txt)
      # The locks are fully pinned: audit the pins, don't re-resolve them.
      - run: pip-audit --no-deps --disable-pip -r requirements.txt -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm audit
        working-directory: theme/static_src

  # Heroku runs only the Python buildpack, so the committed CSS is what ships.
  # An npm bump that changes the build fails here until the CSS is rebuilt
  # and checked by eye.
  css:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: theme/static_src/package-lock.json
      - run: npm ci
        working-directory: theme/static_src
      - run: npm run build
        working-directory: theme/static_src
      - run: git diff --exit-code --stat theme/static/css/dist/styles.css

  # The minified JS and the bundles are committed and are what the pages
  # load, so a source edited without re-running the minifier ships nothing.
  js:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: scripts/minify_js.sh --check
      # The two scripts terser never parses: it minifies each app's js/
      # directory, not the admin's below it nor the smoke test itself
      - run: node --check games/static/games/js/admin/markdown-preview.js
      - run: node --check scripts/browser_smoke.js

  # Real Chrome over the main pages at desktop and phone widths: fails on an
  # uncaught error, an Alpine expression error or a CSP violation - the
  # template bindings that only throw in a browser, which no Python test sees.
  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py shell < scripts/smoke_seed.py
      - run: python manage.py runserver 127.0.0.1:8000 --noreload > runserver.log 2>&1 &
      - name: Wait for the server
        run: |
          for attempt in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/healthz/ && exit 0
            sleep 1
          done
          cat runserver.log
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install --no-save --prefix /tmp/smoke puppeteer-core@25.16.0
      - run: node scripts/browser_smoke.js http://127.0.0.1:8000
        env:
          NODE_PATH: /tmp/smoke/node_modules
      # The server's side of a failed check: a 500's traceback is only here.
      # No file yet if a step before the server failed.
      - name: Print the server log
        if: failure()
        run: test ! -f runserver.log || cat runserver.log
