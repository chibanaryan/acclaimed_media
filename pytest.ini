[pytest]
DJANGO_SETTINGS_MODULE = acclaimedgames.settings
python_files = test_*.py
testpaths = games/tests books/tests core/tests music/tests
addopts = -n auto --cov=games --cov=books --cov=core --cov=music --cov-fail-under=100 --cov-report=term-missing:skip-covered
# An API the next Django release removes fails the suite, here and in CI,
# rather than waiting to be found by hand at the upgrade. The class is
# Django's alias for "removed in the next version", so it moves on by itself.
filterwarnings =
    error::django.utils.deprecation.RemovedInNextVersionWarning
