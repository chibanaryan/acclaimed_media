{# Auth Modal - modal-based authentication flow #}
<dialog id="authModal" class="modal">
    <div class="modal-box bg-base-200 max-w-md max-h-[calc(100dvh-2rem)] overflow-y-auto">
        <button type="button"
                class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
                aria-label="close"
                data-close-dialog>
            <span class="mdi mdi-close" aria-hidden="true"></span>
        </button>
        <div id="auth-modal-content">
            {# Content loaded via HTMX when modal opens #}
        </div>
    </div>
    <div class="modal-backdrop" data-close-dialog="authModal"></div>
</dialog>
