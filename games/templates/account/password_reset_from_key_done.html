{% extends "account/base_auth.html" %}

{% block title %} - Password Changed{% endblock %}

{% block auth_content %}
    <div class="text-center">
        <span class="mdi mdi-check-circle text-5xl text-success mb-4"></span>

        <h1 class="text-3xl font-bold mb-4">Password Changed</h1>

        <p class="text-base-content/85 mb-6">
            Your password has been successfully reset.
            You can now log in with your new password.
        </p>

        <a href="{% url 'account_login' %}" class="btn btn-primary">
            <span class="mdi mdi-login mr-2"></span>
            Login
        </a>
    </div>
{% endblock %}
