"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
archive = ""
setup = "$CONDUCTOR_ROOT_PATH/scripts/setup_worktree.sh"

[scripts.run.run]
available_in = "local"
command = "DEBUG=True venv/bin/python manage.py runserver $($CONDUCTOR_ROOT_PATH/scripts/setup_worktree.sh --print-port)"
default = true
icon = "play"
